  <!-- Displays instantly on slow networks -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p style="margin-top: 12px; color: #666;">Loading application assets...</p>
  </div>

  <div id="root"></div>

  <style>
    #loading-screen {
      position: fixed; inset: 0; background: #ffffff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: system-ui, sans-serif; z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      border: 3px solid #f3f3f3; width: 40px; height: 40px;
      border-radius: 50%; border-top: 3px solid #3498db;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  </body>
